# Propose chaque mois des pull requests de mise à jour : actions GitHub (SHA figés,
# commentaire de version mis à jour) et dépendances Python (versions et empreintes).
# À relire puis fusionner à la main ; rien n'est appliqué automatiquement.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # pyee et greenlet sont des dépendances de Playwright, qui impose leur version majeure
    # (ex. pyee<14) : une montée de version majeure seule casse l'installation.
    ignore:
      - dependency-name: pyee
        update-types: ["version-update:semver-major"]
      - dependency-name: greenlet
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
